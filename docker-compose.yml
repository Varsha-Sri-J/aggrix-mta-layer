services:
  # ============================================================================
  # PostgreSQL Service (Multi-Tenant Storage Layer)
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: aggrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aggrix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aggrix_password}
      POSTGRES_DB: ${POSTGRES_DB:-aggrix_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aggrix_user} -d ${POSTGRES_DB:-aggrix_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      aggrix-network:
        aliases:
          - postgres

  # ============================================================================
  # AGGRIX Backend FastAPI Application
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aggrix-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-AGGRIX MTA Layer}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-aggrix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aggrix_password}
      POSTGRES_DB: ${POSTGRES_DB:-aggrix_db}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-aggrix_user}:${POSTGRES_PASSWORD:-aggrix_password}@db:5432/${POSTGRES_DB:-aggrix_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:8000}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
      DB_ECHO: ${DB_ECHO:-false}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aggrix-network

  # ============================================================================
  # AGGRIX Analytics Aggregation Worker Daemon
  # ============================================================================
  analytics-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: aggrix-mta-layer-backend:latest
    container_name: aggrix-analytics-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-AGGRIX MTA Layer}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-aggrix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aggrix_password}
      POSTGRES_DB: ${POSTGRES_DB:-aggrix_db}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-aggrix_user}:${POSTGRES_PASSWORD:-aggrix_password}@db:5432/${POSTGRES_DB:-aggrix_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
      DB_ECHO: ${DB_ECHO:-false}
    volumes:
      - ./backend/app:/app/app
    command: ["python", "-m", "app.analytics.worker"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aggrix-network



# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  postgres_data:
    driver: local

# ==============================================================================
# Isolated Internal Network
# ==============================================================================
networks:
  aggrix-network:
    driver: bridge
